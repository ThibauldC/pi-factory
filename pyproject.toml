[project]
name = "pi-factory"
version = "0.1.0"
description = "Lightweight dispatcher that turns GitHub issues into reviewed pull requests by driving the pi coding agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pi-factory = "pi_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_factory"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings read better unwrapped.
"src/pi_factory/dashboard.py" = ["E501"]
